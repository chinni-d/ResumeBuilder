{% extends "base.html" %}

{% block title %}Register - Resume Builder{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="card-title text-center mb-4">
                        <i class="fas fa-user-plus text-primary me-2"></i>Register
                    </h2>
                    
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <input type="text" class="form-control" id="name" name="name" required autocomplete="off" autofocus placeholder="Enter your Full Name">
                        </div>
                        
                        <div class="mb-3">
                            <input type="email" class="form-control" id="email" name="email" required autocomplete="off" placeholder="Enter your email">
                        </div>
                        
                        <div class="mb-3">
                            <input type="password" class="form-control" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Password">
                        </div>
                        
                        <div class="mb-3">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required autocomplete="new-password" placeholder="Confirm Password">
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-user-plus me-2"></i>Register
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="mb-0">Already have an account? 
                            <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Login here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
